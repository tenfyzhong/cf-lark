name: Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      inspect:
        description: Inspect existing deployment using GET requests only
        type: boolean
        default: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  CI: 'true'

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy production
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      DEPLOY_ENABLED: ${{ secrets.DEPLOY_ENABLED || 'true' }}
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
      ACCESS_EMAIL_DOMAIN: ${{ secrets.ACCESS_EMAIL_DOMAIN }}
      WORKER_NAME: ${{ secrets.WORKER_NAME }}
      LARK_OAUTH_PROTOCOL: ${{ secrets.LARK_OAUTH_PROTOCOL }}
      LARK_DPOP_MODE: ${{ secrets.LARK_DPOP_MODE }}
    steps:
      - if: env.DEPLOY_ENABLED == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - if: env.DEPLOY_ENABLED == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - if: env.DEPLOY_ENABLED == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: pnpm
      - if: env.DEPLOY_ENABLED == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.DEPLOY_ENABLED == 'true'
        run: pnpm configure:deployment
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: env.DEPLOY_ENABLED == 'true'
        run: pnpm provision:r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: env.DEPLOY_ENABLED == 'true'
        run: pnpm deploy:actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: env.DEPLOY_ENABLED == 'true'
        run: pnpm verify:deployment
      - name: Remove private deployment files
        if: always()
        run: rm -f -- wrangler.production.jsonc wrangler.engine-docs.production.jsonc wrangler.engine-mail.production.jsonc deployment-secrets.production.json

  inspect:
    name: Inspect deployment configuration
    if: github.event_name == 'workflow_dispatch' && inputs.inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm inspect:deployment
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          ACCESS_EMAIL_DOMAIN: ${{ secrets.ACCESS_EMAIL_DOMAIN }}
          WORKER_NAME: ${{ secrets.WORKER_NAME }}
          LARK_OAUTH_PROTOCOL: ${{ secrets.LARK_OAUTH_PROTOCOL }}
          LARK_DPOP_MODE: ${{ secrets.LARK_DPOP_MODE }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
